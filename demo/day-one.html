<title>CS Core Study Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Three screens in one window: Today, Curriculum, the board. The session runner lives inside
   Today. Single-theme light by design: every colour is an
   explicit token. */
:root{
  --paper:#eef3f5; --surface:#fdfeff; --surface-2:#e9eff2; --surface-3:#f7fafb; --surface-4:#e2eaee;
  --ink:#17252b; --muted:#44565f; --faint:#5c6a72;
  --line:#d6e0e5; --line-mid:#a8b8c0;
  --peacock:#126f67; --peacock-deep:#0a554f; --peacock-soft:#e6f2f1; --peacock-line:#b4d2ce;
  --peacock-tint:#dfeeec; --on-peacock:#fdfeff; --peacock-pale:#8dbdb7;
  --cinnabar:#ad4231; --cinnabar-soft:#fbeee9; --cinnabar-line:#e3bdb2;
  --pine:#1a6b58; --pine-soft:#e4f1ed; --pine-line:#bbddd2;
  --amber:#80570f; --amber-soft:#faf0d8; --amber-line:#e3cf9b;
  --slate:#c6d2d8; --disabled:#bdcad1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
::selection{background:var(--peacock-tint);color:var(--ink)}
:root{scrollbar-color:var(--line-mid) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-mid);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{text-underline-offset:2px;text-decoration-thickness:1px}
input,textarea{caret-color:var(--peacock)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;max-width:1040px;margin:0 auto}

.win{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);
  box-shadow:0 1px 2px rgba(31,43,47,.05),0 12px 32px -16px rgba(31,43,47,.18)}
.bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--surface-4);
  border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--slate)}
.url{margin-left:9px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.app{display:flex;min-height:620px;position:relative;min-width:0}
.win,.body,.rail,.panel,.read,.parts{min-width:0}

.rail{width:168px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface-3);
  padding-block:16px;display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--serif);font-size:15px;padding:0 16px 16px;display:flex;align-items:center;gap:8px}
.sealmk{width:23px;height:23px;border-radius:3px;background:var(--cinnabar);color:var(--on-peacock);
  font-size:11px;display:grid;place-items:center;font-family:var(--sans);font-weight:700;letter-spacing:-.4px}
.nav{appearance:none;border:0;background:none;text-align:left;font:inherit;font-size:14px;
  color:var(--muted);padding:7px 16px;cursor:pointer;border-left:2px solid transparent;width:100%}
.nav:hover{color:var(--ink)}
.nav[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--peacock);
  background:var(--surface-2)}
.railfoot{margin-top:auto;padding:0 16px;font-size:12px;color:var(--muted);line-height:1.5}
.railfoot strong{color:var(--ink);font-weight:700;letter-spacing:.04em;font-size:11.5px}

.body{flex:1;min-width:0;padding:26px 30px 30px;display:flex;flex-direction:column}
.kicker{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 5px}
h1{font-family:var(--serif);font-size:25px;font-weight:600;margin:0 0 5px;letter-spacing:-.2px;text-wrap:balance}
h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px;max-width:60ch}

.card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:15px 17px}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 7px}
.done{display:flex;gap:9px;align-items:baseline;font-size:13px;color:var(--muted);margin:0 0 14px}
.done .tick{color:var(--pine);font-weight:700}

/* the task panel */
.panel{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel .hd{padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .hd .l{font-weight:600;font-size:15px}
.panel .bd{padding:15px 17px}
.srcbtn{appearance:none;border:1px solid var(--peacock-line);background:var(--peacock-soft);
  color:var(--peacock);border-radius:20px;font:inherit;font-size:12px;font-weight:500;
  padding:3px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.srcbtn:hover{border-color:var(--peacock)}
.srcbox{border:1px solid var(--peacock-line);background:var(--peacock-soft);border-radius:7px;
  padding:12px 15px;margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.6}
.srcbox .sl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--peacock);
  font-weight:600;margin:0 0 7px;display:block}
.srcbox a{color:var(--peacock)}
.srclist{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}

.read{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.read .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.read .rh b{font-size:14px}
.read .rh span{font-size:12px;color:var(--muted)}
.read ul{list-style:none;margin:0;padding:6px 16px 12px}
.read li{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.read li:first-child{border-top:0}
.read a{color:var(--peacock);text-decoration:none}
.read a:hover{text-decoration:underline}
.read .wh2{font-size:12px;color:var(--faint);white-space:nowrap}

.refcard{border:1px solid var(--line);border-radius:8px;background:var(--surface-3);
  padding:12px 15px;margin:0 0 14px}
.refcard .rl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 9px;display:block}
.refrow{display:flex;gap:14px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.refrow:first-of-type{border-top:0}
.refrow .k{font-size:13px;color:var(--muted);width:168px;flex-shrink:0}
.refrow code{font-family:var(--mono);font-size:12.5px;white-space:pre;overflow-x:auto;min-width:0}
.skip{color:var(--faint);font-size:12px;margin-left:8px}
.parts{border:1px solid var(--line);border-radius:8px;padding:13px 16px;margin:0 0 12px;
  background:var(--surface-3)}
.parts .rl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 9px;display:block}
.prow{display:flex;gap:11px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pn{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-mid);
  color:var(--muted);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.prow.now .pn{background:var(--peacock);border-color:var(--peacock);color:var(--on-peacock)}
.prow .pt{flex:1;min-width:0;font-size:13.5px}
.prow.now .pt{font-weight:600}
.prow .pk{font-size:12px;color:var(--faint);text-align:right}
@media (max-width:560px){.prow{flex-wrap:wrap}.prow .pk{text-align:left;width:100%}}
.logrow{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.logrow:first-child{border-top:0}
.logrow .lk{width:112px;flex-shrink:0;color:var(--muted);font-size:12px}
.afternote{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--cinnabar-line);font-weight:600}
.refhead{appearance:none;border:0;background:none;width:100%;display:flex;justify-content:space-between;
  align-items:center;gap:12px;padding:0;cursor:pointer;font:inherit;text-align:left;flex-wrap:wrap}
.refhead .rl{margin:0}
.refsum{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.refhead:hover .refsum{color:var(--peacock)}
.inline{display:flex;gap:9px;align-items:flex-start;border:1px solid;border-radius:8px;
  padding:11px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.55}
.inline.good{background:var(--pine-soft);border-color:var(--pine-line);color:var(--ink)}
.inline.good .ic{color:var(--pine);margin-top:3px}
.inline.miss{background:var(--amber-soft);border-color:var(--amber-line);color:var(--ink)}
.inline.miss .ic{color:var(--amber);margin-top:3px}
.demoskip{font-size:12.5px;color:var(--faint);margin:14px 0 0;padding-top:12px;
  border-top:1px dashed var(--line)}
.linkish{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:12.5px;
  color:var(--peacock);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkish:hover{color:var(--peacock-deep)}
.refnote{font-size:12.5px;color:var(--faint);margin:10px 0 0;line-height:1.55}
.nest{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.csk{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 12px}
.csk .cs{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 11px;
  background:var(--surface-2);color:var(--muted)}
.csk .cs b{color:var(--ink);font-weight:600;margin-right:6px}
.csk .cs.on{border-color:var(--cinnabar-line);color:var(--ink)}
.term{margin-top:4px}
.tl{display:flex;gap:16px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.tl code{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;flex:0 0 46%;min-width:0}
.tl code em{font-style:normal;background:var(--surface-2);padding:0 3px;border-radius:3px}
.tl .pr{color:var(--faint)}
.tl .tg{font-size:12.5px;color:var(--faint);min-width:0}
.rec{border:1px solid var(--line);border-radius:8px;background:var(--surface-3);
  padding:12px 16px;margin:14px 0 0}
.rec .rl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:4px}
.recrow{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.recrow strong{font-weight:600;font-size:12.5px}
@media (max-width:820px){.tl{flex-direction:column;gap:2px}.tl code{flex:none}}
@media (max-width:820px){.refrow{flex-direction:column;gap:3px}.refrow .k{width:auto}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface-3);text-decoration:none}
.chip.hot{border-color:var(--cinnabar-line);background:var(--cinnabar-soft);color:var(--cinnabar)}
.chip.src{border-color:var(--peacock-line);background:var(--peacock-soft);color:var(--peacock);
  font-size:12px;font-weight:500}

/* the three-task ladder */
.lad{display:flex;flex-direction:column;gap:0;margin:0 0 15px}
.rung{display:flex;gap:13px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.rung .ds{min-height:3.2em}
.lad .rung .pass{min-height:1.5em}
.rung:first-child{border-top:0;padding-top:2px}
.rung .num{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-mid);color:var(--muted);
  font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;align-self:center}
.rung.hi .num{background:var(--peacock);border-color:var(--peacock);color:var(--on-peacock)}
.rung .nm{font-weight:600;font-size:14px;width:134px;flex-shrink:0}
.rung .ds{font-size:13.5px;color:var(--muted);flex:1;min-width:0;line-height:1.5}
.rung .ds code{font-family:var(--mono);font-size:12.5px}
.rung .pass{display:block;margin-top:3px;font-size:12.5px;color:var(--faint)}
.rung .pass b{color:var(--muted);font-weight:600}
.tap{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:14px;font:inherit;font-size:12px;padding:2px 11px;cursor:pointer;margin-left:6px}
.tap:hover{border-color:var(--peacock);color:var(--peacock)}
.rung .pass strong.agree{color:var(--pine);font-weight:600}
.rung .pass strong.disagree{color:var(--amber);font-weight:600}

button.go{appearance:none;border:0;border-radius:6px;background:var(--peacock);color:var(--on-peacock);
  font:inherit;font-size:14px;font-weight:600;padding:9px 18px;cursor:pointer}
button.go:hover{background:var(--peacock-deep)}
button.go:disabled{background:var(--disabled);color:var(--surface-3);cursor:not-allowed}
button.gh{appearance:none;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:14px;padding:8px 15px;cursor:pointer}
button.gh:hover{border-color:var(--muted)}
button.bk{appearance:none;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  color:var(--muted);font:inherit;font-size:13px;padding:7px 13px;cursor:pointer}
button.bk:hover{border-color:var(--muted);color:var(--ink)}
button.bk{display:inline-flex;align-items:center;gap:6px}
.wm{display:inline-block;margin-left:8px;font-size:11px;padding:1px 8px;border-radius:12px;
  background:var(--cinnabar-soft);color:var(--cinnabar);border:1px solid var(--cinnabar-line);
  font-weight:600;vertical-align:1px}
.wm2{display:inline-block;margin-left:8px;font-size:12px;color:var(--faint)}
.hererow{appearance:none;border:0;background:none;font:inherit;color:inherit;padding:0;
  text-align:left;cursor:pointer}
.hererow:hover .here{background:var(--peacock);color:var(--on-peacock)}
.here{display:inline-block;margin-left:9px;font-size:11.5px;font-weight:600;color:var(--peacock);
  background:var(--peacock-soft);border:1px solid var(--peacock-line);border-radius:12px;padding:1px 8px}
.read a,.chip.src{display:inline-flex;align-items:center;gap:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);max-width:44ch}
:focus-visible{outline:2px solid var(--peacock);outline-offset:2px}

.pips{display:flex;gap:10px;margin:0 0 10px;list-style:none;padding:0}
.pips li{flex:1;min-width:0}
.pip{display:block;width:100%;text-align:left;font:inherit;font-size:12px;font-weight:600;
  color:var(--faint);background:none;border:0;padding:7px 0 0;border-top:2px solid var(--line);
  cursor:default;letter-spacing:.01em}
.pip.on{color:var(--peacock);border-top-color:var(--peacock)}
.pip.past{color:var(--muted);border-top-color:var(--peacock-pale);border-top-width:4px;cursor:pointer}
.pip.past .tk{color:var(--pine);margin-right:5px;vertical-align:-2px}
.pip.past:hover{color:var(--ink);border-top-color:var(--peacock)}
@media (max-width:560px){.pips{gap:6px}.pip{font-size:10.5px;letter-spacing:0;padding-top:5px}
  .pip .lbl2{display:none}}
.navline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 18px;
  min-height:28px;flex-wrap:wrap}
.locked{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.locked i{width:5px;height:5px;border-radius:50%;background:var(--pine);display:inline-block}

h2.stp{font-size:21px;margin:0 0 14px}
.ask{font-family:var(--serif);font-size:21px;font-weight:600;margin:4px 0 15px;max-width:46ch;
  line-height:1.4;text-wrap:balance;letter-spacing:-.1px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 15px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;
  padding:11px 14px;cursor:pointer;background:var(--surface);font-size:14px}
.opt:hover{border-color:var(--line-mid)}
.opt input{margin:3px 0 0;accent-color:var(--peacock);flex-shrink:0}
.opt.sel{border-color:var(--peacock);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--peacock)}
.opt.ro{cursor:default;opacity:.75}
.opt.ro:hover{border-color:var(--line)}
textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px 13px;font:inherit;
  font-size:14px;background:var(--surface);color:var(--ink);resize:vertical;min-height:62px;margin:0 0 14px}
textarea#paste{font-family:var(--mono);font-size:13px}
textarea::placeholder{color:var(--faint)}
textarea[readonly]{background:var(--surface-2);color:var(--muted)}

pre{font-family:var(--mono);font-size:12.5px;background:var(--surface-4);border:1px solid var(--line);
  border-radius:7px;padding:12px 14px;overflow-x:auto;margin:0;line-height:1.65}
pre b{color:var(--cinnabar);font-weight:600}
.code2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.code2>div{min-width:0}
.cwrap .lbl{margin-bottom:5px}

.yours{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin:0 0 15px;
  font-size:14px;color:var(--muted);background:var(--surface-3)}
.yours b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  margin-bottom:4px;font-weight:600}
.yours span{color:var(--ink)}
.note{border-left:2px solid var(--cinnabar);background:var(--cinnabar-soft);border-radius:0 7px 7px 0;
  padding:13px 16px;margin:0 0 15px;font-size:14px;max-width:62ch}
.note b.nh{display:block;font-family:var(--serif);color:var(--cinnabar);margin-bottom:4px;font-size:13px}
.verdict{display:flex;gap:12px;align-items:center;border:1px solid;border-radius:8px;padding:12px 16px;
  margin:0 0 10px;font-size:14px;flex-wrap:wrap}
.verdict.good{background:var(--pine-soft);border-color:var(--pine-line)}
.verdict.miss{background:var(--amber-soft);border-color:var(--amber-line)}
.verdict.flat{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.verdict .big{font-family:var(--serif);font-size:15px;font-weight:600;flex-shrink:0}
.verdict.good .big{color:var(--pine)} .verdict.miss .big{color:var(--amber)}
.verdict.flat .big{color:var(--ink)}
.verdict span{min-width:0}
@keyframes settle{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.verdict{animation:settle .42s cubic-bezier(.16,1,.3,1) both}
.verdict+.verdict{animation-delay:.09s}

.tscroll{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin:9px 0}
.mini th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:0 10px 6px 0;font-weight:600}
.mini td{padding:6px 10px 6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini td:first-child{font-family:var(--mono);font-size:12px}
.mini .d{color:var(--cinnabar);font-weight:600}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:10px;margin:0 0 14px}
.blk{border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--surface);min-width:0}
.blk .n{font-weight:600;font-size:14px;margin-bottom:1px}
.bid{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.05em}
.blk .q{font-size:12.5px;color:var(--muted);margin-bottom:11px;line-height:1.45}
.bars{display:flex;flex-direction:column;gap:6px}
.bar2{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:13px}
.bar2 .bl{display:flex;flex-direction:column;min-width:0}
.bar2 .bh{font-weight:600;color:var(--ink);font-size:13px}
.bar2 .bx{color:var(--muted);font-size:12.5px;line-height:1.4}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--faint);
  background:var(--surface-3);font-weight:500;white-space:nowrap}

/* ---------- the graders ----------
   Every check type here is one of DESIGN.md section 18's. No model is involved,

function gradeGroupShape(txt){
  var seg=String(txt).replace(/[{}]/g," ").split(/[,\n\r]+/),
      seen={},total=0,blank=false,found=0,k,m,i;
  for(i=0;i<seg.length;i++){
    m=seg[i].match(/^\s*(.*?)\s*[:|]\s*(\d+)\s*$/);
    if(!m)continue;
    k=m[1].replace(/^['"]|['"]$/g,"").trim();
    found++;seen[k]=+m[2];total+=+m[2];
    if(k==="")blank=true}
  var n=Object.keys(seen).length;
  if(!found)return{ok:false,why:"Nothing here looks like a group and a count. Paste what the script printed, not a description of it."};
  if(n<3)return{ok:false,why:"Only "+n+" group"+(n===1?"":"s")+". There are three once the blank one is counted."};
  if(!blank)return{ok:false,why:"Three groups, but none of them blank — the fourth row was dropped instead of counted."};
  if(total!==4)return{ok:false,why:"The counts total "+total+", not 4. Every row belongs to exactly one group."};
  return{ok:true,why:"Three groups including the blank, totalling 4."}}

/* Pairs each answer with the command above it. The session's whole point is that
   the machine says one thing and the environment says another, so accepting them
   swapped marks the exact confusion this session exists to cure as correct. */
function gradePaired(t){
  var lines=String(t).split(/\r?\n/),seen={},cur=null,i,l;
  for(i=0;i<lines.length;i++){
    l=lines[i].trim();
    if(!l)continue;
    if(/uname\s+-m/.test(l)){cur="machine";continue}
    if(/platform\.machine/.test(l)){cur="env";continue}
    var m=l.match(/\b(arm64e?|x86_64|i386)\b/);
    if(m&&cur){seen[cur]=m[1];cur=null}}
  if(!seen.machine&&!seen.env)
    return{ok:false,why:"I cannot find either answer under its command. Paste the terminal itself \u2014 each command, and the line that came back under it."};
  if(!seen.machine)return{ok:false,why:"I can see what a Python said, but not what the machine said. Run <span class=\"mo\">uname -m</span> too, and paste both."};
  if(!seen.env)return{ok:false,why:"I can see what the machine said, but not what a Python said from inside your environment. Run that one too, and paste both."};
  if(seen.machine!=="arm64"&&seen.machine!=="arm64e")
    return{ok:false,why:"Those are the right two answers, under the wrong two commands. <strong>Look again at which one you asked the machine and which you asked the Python</strong> \u2014 that is the whole of this session."};
  return{ok:true,why:"The machine says "+seen.machine+" and the Python in your environment says "+seen.env+
    (seen.env===seen.machine?". They agree \u2014 so you already fixed it, or you made the environment from a native Python."
                            :". They do not agree, and that is the finding.")}}

        return{ok:false,why:"That is not the shape this asks for. Paste the terminal itself \u2014 "+
          "the commands you typed and what came back under each one \u2014 not just the answers."}}
    return{ok:true,why:"That is the output this one produces."}}
  if(c.k==="contains_any"){
    for(i=0;i<c.need.length;i++){
      if(t.toLowerCase().indexOf(String(c.need[i]).toLowerCase())>=0)
        return{ok:true,why:"Accepted."}}
    return{ok:false,why:"I cannot see the shape this asks for. It should mention one of: "+c.need.join(", ")+"."}}
  return{ok:false,why:"No check defined."}}

 [/traceback|error/i,"A <b>traceback</b> is what Python prints when it stops. Read it bottom-up: the last line names what went wrong, the lines above say where."],
 [/curl|download/i,"<b>curl -O &lt;url&gt;</b> fetches a file into the current folder, keeping its name. It is a shell command, not Python."],
 [/stuck/i,"Fifteen minutes stuck is expected. At forty, write down what you tried and move on."]
];
function answerFor(q){
  for(var i=0;i<GLOSS.length;i++){if(GLOSS[i][0].test(q))return GLOSS[i][1]}
  return "This demo answers from a short authored list, so it has nothing for that one. The real app "+
    "sends it to the model through <span class=\"mo\">/api/llm</span>, which answers in the language "+
    "you asked and still refuses to write or debug your code."}

function askRender(){
  var el=document.getElementById("askfab");
  if(!el)return;
  /* Off from the moment the session card is on screen until the answer is locked:
     the card already shows the tasks and the reading, so a live bubble there can
     simply be asked the question. Live on the map and the board, which hold no
     prediction open. */
  var r=R(),locked=(r.maxStep<2&&S.screen==="today"),h="",i,j,left=0;
  if(S.askOpen&&!locked){
    h+='<div class="askpanel"><div class="ah"><b>Ask anything</b>'+
       '<span>Answers follow your language</span>'+
       '<button class="ax" data-act="askclose" aria-label="Close">'+ic("close")+'</button></div>'+
       '<div class="askbd">';
    if(!S.askSeen.length&&!S.askLog.length){
      h+='<div class="qa"><div class="a">Ask it to explain a term, a syntax error or a traceback, at '+
         'any point while you work. It will not write your code or debug it for you, and it cannot '+
         'tell you whether your answer is right — that comes from running it.</div></div>'}
    for(i=0;i<S.askSeen.length;i++){j=S.askSeen[i];
      h+='<div class="qa"><div class="q">'+QA[j].q+'</div><div class="a">'+QA[j].a+'</div></div>'}
    for(i=0;i<S.askLog.length;i++){
      h+='<div class="qa"><div class="q">'+esc(S.askLog[i].q)+'</div><div class="a">'+
         S.askLog[i].a+'</div></div>'}
    h+='</div><div class="askq"><div class="askrow">'+
       '<input id="askbox" type="text" placeholder="Type a question — any language">'+
       '<button class="go" data-act="asksend">Ask</button></div>';
    for(j=0;j<QA.length;j++){if(S.askSeen.indexOf(j)<0)left++}
    if(left){h+='<span class="sg">Or try one</span>';
      for(j=0;j<QA.length;j++){
        if(S.askSeen.indexOf(j)<0)h+='<button class="sgb" data-ask="'+j+'">'+QA[j].q+'</button>'}}
    h+='</div></div>'}
  if(locked){
    h+='<div class="askwhy">Off until your answer is locked. It would hand you the thing you are '+
       'about to guess.</div><button class="fab off2" disabled><span class="gl">?</span> Ask</button>'}
  else{h+='<button class="fab" data-act="asktoggle"><span class="gl">?</span> Ask</button>'}
  el.innerHTML=h}

/* ---------- render ---------- */
function render(){
  var r=R(),s=sess(),h="";
  if(S.screen==="curric"){h=curric()}
  else if(S.screen==="path"){
    h='<h1>With help, or on your own</h1>'+
      '<p class="sub">Four blocks, two skills each. No percentages, no streaks, no dates — these '+
      'eight lines are the whole record.</p>'+board()+
      '<p class="after">Session 1 moves none of them. A1\u2019s <em>Build</em> reaches '+
      '<em>with help</em> at session 7 and <em>on your own</em> at session 9.</p>'}
  else if(r.step===0){h=todayCard()}
  else if(r.step>=1&&r.step<=4){
    h=pips()+navline()+
      (r.step===1?stepPredict():r.step===2?stepDo():r.step===3?stepCompare():stepRecord())}
  else{
    var ok=grade(r.paste).ok;
    if(ok)r.earned=true;
    h='<h1>Session '+s.n+' done</h1>'+
      '<p class="sub">'+(s.gate
        ? 'That was a gate: '+s.gate+'.'
        : 'Nothing on the board moved, and nothing was meant to. A1\u2019s <em>Build</em> reaches '+
          '<em>with help</em> at session 7, the first session holding every piece it needs.')+
        '</p>'+board()+
      (r.label!==null?'<div class="panel" style="margin-top:16px"><div class="hd">'+
        '<span class="l">Filed from this session</span>'+
        '<span class="chip">comes back in a few sessions</span></div><div class="bd">'+
        '<div class="logrow"><span class="lk">You guessed</span><span>'+
        esc(s.opts[r.choice].replace(/<[^>]+>/g,""))+'</span></div>'+
        (r.why.trim()?'<div class="logrow"><span class="lk">Your reason</span><span>'+
          esc(r.why)+'</span></div>':'')+
        '<div class="logrow"><span class="lk">What happened</span><span>'+
        (r.choice===s.ok?"You had it right.":"Not that \u2014 "+
          esc(s.opts[s.ok].replace(/<[^>]+>/g,"")))+'</span></div>'+
        '<div class="logrow"><span class="lk">You filed</span><span>'+esc(s.lbl[r.label])+
        '</span></div></div></div>':'')+
      '<div class="next-up"><div class="l"><span class="rk">Next</span>'+
      '<span class="rt">Session 2 &middot; Order and state</span>'+
      '<span class="undercode">Loops, branching, and a variable that changes. The rows are handed '+
      'to you; you write what happens to them, one at a time.</span></div>'+
      '<span class="chip">in the full course, not in this demo</span></div>'+
      '<div class="row" style="margin-top:14px">'+
      '<button class="bk" data-act="back">'+ic("back")+'Back to step 4</button>'+
      '<button class="bk" data-act="restart">Run it again from the start</button></div>'}
  document.getElementById("body").innerHTML=h;
  var i,navs=document.querySelectorAll(".nav");
  for(i=0;i<navs.length;i++){
    navs[i].setAttribute("aria-current",navs[i].dataset.screen===S.screen?"true":"false")}
  var foot=document.getElementById("railfoot");
  if(foot)foot.innerHTML='<strong>A1</strong> Code &amp; debugging<br>session '+s.n+' of 21';
  askRender()}

function goStep(n){var r=R();r.step=n;if(n>r.maxStep)r.maxStep=n;render()}
function readWhy(){var t=document.getElementById("why");if(t&&!t.readOnly)R().why=t.value}
function readPaste(){var t=document.getElementById("paste");if(t)R().paste=t.value}

/* One delegated handler. Every attribute read below must also appear in this
   selector, or the control silently does nothing. That has happened twice. */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-screen],[data-pick],[data-lbl],[data-jump],[data-ask],[data-pred],[data-res]");
  if(!el)return;
  var r=R(),a,b;
  if(el.dataset.screen){S.screen=el.dataset.screen;
    if(S.screen==="today"&&r.step>=1&&r.step<=4)r.step=0;
    render();return}
  if(el.dataset.pick!==undefined){readWhy();r.choice=+el.dataset.pick;render();return}
  if(el.dataset.lbl!==undefined){r.label=+el.dataset.lbl;render();return}
  if(el.dataset.jump!==undefined){goStep(+el.dataset.jump);return}
  if(el.dataset.ask!==undefined){S.askSeen.push(+el.dataset.ask);askRender();return}
  if(el.dataset.pred!==undefined){a=el.dataset.pred.split("|");readPaste();
    r.pred[+a[0]]=+a[1];render();return}
  if(el.dataset.res!==undefined){b=el.dataset.res.split("|");readPaste();
    r.res[+b[0]]=+b[1];render();return}
  switch(el.dataset.act){
    case "begin": S.screen="today";goStep(1);break;
    case "resume": S.screen="today";goStep(r.maxStep);break;
    case "lock": readWhy();goStep(2);break;
    case "fwd": if(r.step===2)readPaste();goStep(r.step+1);break;
    case "back": if(r.step<=1){r.step=0;render()}else{goStep(r.step-1)} break;
    case "restart": S.runs[sess().n]=blank();render();break;
    case "src": S.srcOpen=!S.srcOpen;render();break;
    case "ref": S.refOpen=!S.refOpen;render();break;
    case "first": S.frOpen=!S.frOpen;render();break;
    case "fill": r.paste="$ uname -m\narm64\n$ python3 -c 'import platform; print(platform.machine())'\nx86_64";
      for(var q=0;q<3;q++){if(r.pred[q]===null&&sess().tasks[q][3]===1)r.pred[q]=1;
        if(r.res[q]===null)r.res[q]=1}
      render();break;
    case "asktoggle": S.askOpen=!S.askOpen;askRender();break;
    case "askclose": S.askOpen=false;askRender();break;
    case "asksend": {var box=document.getElementById("askbox"),q=box?box.value.trim():"";
      if(!q)break;S.askLog.push({q:q,a:answerFor(q)});if(box)box.value="";askRender();
      var bd=document.querySelector(".askbd");if(bd)bd.scrollTop=bd.scrollHeight;break}
  }});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.id==="askbox"){e.preventDefault();
    var q=e.target.value.trim();if(!q)return;
    S.askLog.push({q:q,a:answerFor(q)});e.target.value="";askRender();
    var b=document.getElementById("askbox");if(b)b.focus()}});
/* Rebuild only the block below the textarea: a full render replaces the textarea
   and throws her caret to the end mid-sentence. */
function refreshVerdict(){
  syncRes();
  var box=document.getElementById("after2");
  if(box)box.innerHTML=after2()}

document.addEventListener("input",function(e){
  if(!e.target)return;
  if(e.target.id==="why"&&!e.target.readOnly)R().why=e.target.value;
  if(e.target.id==="paste"){R().paste=e.target.value;refreshVerdict()}});

render();
</script>
